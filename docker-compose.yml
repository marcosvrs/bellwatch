name: bellwatch
services:
  bellwatch:
    image: ghcr.io/marcosvrs/bellwatch
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_started
    environment:
      # Set SHOUTRRR_URL and/or the three required HERMES_* variables in .env.
      SHOUTRRR_URL: "${SHOUTRRR_URL:-}"
      HERMES_WEBHOOK_URL: "${HERMES_WEBHOOK_URL:-}"
      HERMES_WEBHOOK_SECRET: "${HERMES_WEBHOOK_SECRET:-}"
      HERMES_CHAT_ID: "${HERMES_CHAT_ID:-}"

      # Active for this Compose stack: use shared Postgres state.
      DATABASE_URL: "postgresql://daft:${POSTGRES_PASSWORD}@postgres:5432/daft"

      # Optional state and healthcheck overrides. Empty values use application defaults.
      HEALTHCHECK_MAX_AGE_SECONDS: "${HEALTHCHECK_MAX_AGE_SECONDS:-}"
      TZ: "${TZ:-}"
      POLL_CRON: "${POLL_CRON:-0 */8 * * *}"
      NOTIFY_EXISTING_ON_FIRST_RUN: "${NOTIFY_EXISTING_ON_FIRST_RUN:-}"

      # Active for this Compose stack: use the Browserless service.
      PLAYWRIGHT_WS_ENDPOINT: "ws://browserless:3000?token=${BROWSERLESS_TOKEN}"
      BROWSER_USER_AGENT: "${BROWSER_USER_AGENT:-}"

      # Optional search overrides. Empty values keep the search unconstrained.
      DAFT_BASE_URL: "${DAFT_BASE_URL:-}"
      DAFT_LOCATION: "${DAFT_LOCATION:-}"
      DAFT_SECTION_PATH: "${DAFT_SECTION_PATH:-}"
      DAFT_RADIUS_KM: "${DAFT_RADIUS_KM:-}"
      DAFT_PRICE_MIN_EUR: "${DAFT_PRICE_MIN_EUR:-}"
      DAFT_PRICE_MAX_EUR: "${DAFT_PRICE_MAX_EUR:-}"
      DAFT_BEDS_MIN: "${DAFT_BEDS_MIN:-}"
      DAFT_BEDS_MAX: "${DAFT_BEDS_MAX:-}"
      DAFT_PROPERTY_TYPES: "${DAFT_PROPERTY_TYPES:-}"
      DAFT_BATHS_MIN: "${DAFT_BATHS_MIN:-}"
      DAFT_BATHS_MAX: "${DAFT_BATHS_MAX:-}"
      DAFT_MEDIA_TYPES: "${DAFT_MEDIA_TYPES:-}"
      DAFT_KEYWORD: "${DAFT_KEYWORD:-}"
      DAFT_AVAILABILITY: "${DAFT_AVAILABILITY:-}"
      DAFT_ADDED_IN_LAST_DAYS: "${DAFT_ADDED_IN_LAST_DAYS:-}"
      DAFT_OPEN_VIEWINGS_FROM: "${DAFT_OPEN_VIEWINGS_FROM:-}"
      DAFT_FACILITIES: "${DAFT_FACILITIES:-}"
      DAFT_LEASE_LENGTH_MIN_MONTHS: "${DAFT_LEASE_LENGTH_MIN_MONTHS:-}"
      DAFT_LEASE_LENGTH_MAX_MONTHS: "${DAFT_LEASE_LENGTH_MAX_MONTHS:-}"
      DAFT_FURNISHING: "${DAFT_FURNISHING:-}"
      DAFT_FLOOR_SIZE_MIN_SQM: "${DAFT_FLOOR_SIZE_MIN_SQM:-}"
      DAFT_FLOOR_SIZE_MAX_SQM: "${DAFT_FLOOR_SIZE_MAX_SQM:-}"
      DAFT_BER_MIN: "${DAFT_BER_MIN:-}"
      DAFT_BER_MAX: "${DAFT_BER_MAX:-}"
      DAFT_SALE_TYPE: "${DAFT_SALE_TYPE:-}"
      DAFT_ONLINE_OFFERS: "${DAFT_ONLINE_OFFERS:-}"
      DAFT_SORT: "${DAFT_SORT:-}"
      DAFT_MAX_PAGES: "${DAFT_MAX_PAGES:-}"
      DAFT_REQUEST_DELAY_MS: "${DAFT_REQUEST_DELAY_MS:-}"
      SHPS_FILTER: "${SHPS_FILTER:-}"

      # Image defaults already supplied by Dockerfile.
      # NODE_ENV: "production"
      # PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    volumes:
      - bellwatch-data:/data
    networks:
      - bellwatch

  # Persistent listing state for the monitor.
  postgres:
    image: postgres:17-alpine
    # POSTGRES_DB and POSTGRES_USER default to daft in this stack so they
    # match the monitor's active DATABASE_URL default.
    # POSTGRES_PASSWORD is required.
    environment:
      POSTGRES_DB: "daft"
      POSTGRES_USER: "daft"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bellwatch

  # Dedicated Chromium/CDP service. The monitor connects over the internal
  # network; the host port is localhost-only for optional debugging.
  # The image and resource settings below are deliberate stack policy.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      # Required Browserless authentication token.
      # CONCURRENT, QUEUED, and TIMEOUT are deliberate resource defaults.
      TOKEN: "${BROWSERLESS_TOKEN:?Set BROWSERLESS_TOKEN in .env}"
      CONCURRENT: "2"
      QUEUED: "4"
      TIMEOUT: "120000"
    # The host debugging port is fixed to localhost:3000; the monitor uses
    # the internal service name.
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "2g"
    restart: unless-stopped
    networks:
      - bellwatch

volumes:
  bellwatch-data:
  postgres-data:

networks:
  # The internal network name is fixed to bellwatch.
  bellwatch:
    name: bellwatch
