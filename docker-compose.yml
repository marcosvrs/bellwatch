name: bellwatch
services:
  bellwatch:
    image: ghcr.io/marcosvrs/bellwatch
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browserless:
        condition: service_started
    environment:
      # Default backend: Shoutrrr. Set NOTIFICATION_BACKEND=hermes below for
      # direct signed delivery to a Hermes WhatsApp chat or group.
      NOTIFICATION_BACKEND: "${NOTIFICATION_BACKEND:-shoutrrr}"
      SHOUTRRR_URL: "${SHOUTRRR_URL:-}"
      HERMES_WEBHOOK_URL: "${HERMES_WEBHOOK_URL:-}"
      HERMES_WEBHOOK_SECRET: "${HERMES_WEBHOOK_SECRET:-}"
      HERMES_CHAT_ID: "${HERMES_CHAT_ID:-}"
      HERMES_TIMEOUT_MS: "${HERMES_TIMEOUT_MS:-20000}"

      # Shoutrrr notification overrides. Defaults are owned by src/config.ts.
      # SHOUTRRR_BINARY: "shoutrrr"
      # SHOUTRRR_TITLE_PREFIX: "Bellwatch new home"
      # SHOUTRRR_TIMEOUT_MS: "15000"

      # Active for this Compose stack: use shared Postgres state.
      DATABASE_URL: "postgresql://daft:${POSTGRES_PASSWORD}@postgres:5432/daft"
      # STATE_FILE: "/data/state.sqlite" # default when DATABASE_URL is omitted

      # Active for this Compose stack: serialize monitor instances with Redis.
      REDIS_URL: "redis://redis:6379/0"
      # REDIS_LOCK_KEY: "bellwatch:monitor"
      # REDIS_LOCK_TTL_SECONDS: "300"

      # Optional state and healthcheck overrides.
      # HEARTBEAT_FILE: "/data/heartbeat"
      # HEALTHCHECK_MAX_AGE_SECONDS: "" # derived: max(POLL_INTERVAL_SECONDS * 3, 300)
      # POLL_INTERVAL_SECONDS: "900"
      # NOTIFY_EXISTING_ON_FIRST_RUN: "false"

      # Active for this Compose stack: use the Browserless service.
      # BROWSER_MODE: "auto" # endpoint selection is automatic
      PLAYWRIGHT_WS_ENDPOINT: "ws://browserless:3000?token=${BROWSERLESS_TOKEN}"
      # CHROMIUM_EXECUTABLE_PATH: "" # unset; uses bundled Chromium
      # CHROMIUM_HEADLESS: "true"
      # CHROMIUM_NO_SANDBOX: "false"
      # Parser default is 60000; Compose uses 120000 to match Browserless.
      BROWSER_TIMEOUT_MS: "120000"
      # BROWSER_USER_AGENT: "" # unset

      # Compose's search profile intentionally differs from two parser defaults.
      # The other search defaults remain available below as commented overrides.
      # DAFT_BASE_URL: "https://www.daft.ie"
      # DAFT_SECTION_PATH: "new-homes-for-sale"
      # DAFT_LOCATION_PATH: "dublin-city-centre-dublin"
      # DAFT_RADIUS_KM: "20"
      # DAFT_PRICE_MIN_EUR: "" # unset; no minimum
      # DAFT_PRICE_MAX_EUR: "499999"
      # DAFT_BEDS_MIN: "3"
      # DAFT_BEDS_MAX: "" # unset
      # DAFT_PROPERTY_TYPES: "houses"
      # DAFT_BATHS_MIN: "" # unset
      # DAFT_BATHS_MAX: "" # unset
      # DAFT_MEDIA_TYPES: "" # unset; equivalent to any
      # DAFT_KEYWORD: "" # unset
      # DAFT_AVAILABILITY: "published"
      DAFT_ADDED_IN_LAST_DAYS: "1"
      # DAFT_OPEN_VIEWINGS_FROM: "" # unset
      DAFT_SORT: "publishDateDesc"
      # DAFT_MAX_PAGES: "1"

      # Image defaults already supplied by Dockerfile.
      # NODE_ENV: "production"
      # PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    volumes:
      - bellwatch-data:/data
    networks:
      - bellwatch

  # Shared listing state for one or more monitor instances.
  postgres:
    image: postgres:17-alpine
    # POSTGRES_DB and POSTGRES_USER default to daft in this stack so they
    # match the monitor's active DATABASE_URL default.
    # POSTGRES_PASSWORD is required.
    environment:
      POSTGRES_DB: "daft"
      POSTGRES_USER: "daft"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bellwatch

  # Distributed poll lease. Postgres remains the source of shared listing state.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - bellwatch

  # Dedicated Chromium/CDP service. The monitor connects over the internal
  # network; the host port is localhost-only for optional debugging.
  # The image and resource settings below are deliberate stack policy.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      # Required Browserless authentication token.
      # CONCURRENT, QUEUED, and TIMEOUT are deliberate resource defaults.
      TOKEN: "${BROWSERLESS_TOKEN:?Set BROWSERLESS_TOKEN in .env}"
      CONCURRENT: "2"
      QUEUED: "4"
      TIMEOUT: "120000"
    # The host debugging port is fixed to localhost:3000; the monitor uses
    # the internal service name.
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "2g"
    restart: unless-stopped
    networks:
      - bellwatch

volumes:
  bellwatch-data:

networks:
  # The internal network name is fixed to bellwatch.
  bellwatch:
    name: bellwatch
