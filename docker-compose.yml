name: bellwatch
services:
  bellwatch:
    image: ghcr.io/marcosvrs/bellwatch
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_started
    environment:
      # Set SHOUTRRR_URL and/or the three required HERMES_* variables in .env.
      SHOUTRRR_URL: "${SHOUTRRR_URL:-}"
      HERMES_WEBHOOK_URL: "${HERMES_WEBHOOK_URL:-}"
      HERMES_WEBHOOK_SECRET: "${HERMES_WEBHOOK_SECRET:-}"
      HERMES_CHAT_ID: "${HERMES_CHAT_ID:-}"

      # Active for this Compose stack: use shared Postgres state.
      DATABASE_URL: "postgresql://daft:${POSTGRES_PASSWORD}@postgres:5432/daft"

      # Optional state and healthcheck overrides.
      # HEALTHCHECK_MAX_AGE_SECONDS: "86400" # default; increase for sparse cron schedules
      # Set TZ here or in .env to propagate the host's configured timezone.
      # Unset means the process detects the container runtime timezone.
      TZ:
      POLL_CRON: "${POLL_CRON:-0 */8 * * *}"
      # NOTIFY_EXISTING_ON_FIRST_RUN: "false"

      # Active for this Compose stack: use the Browserless service.
      PLAYWRIGHT_WS_ENDPOINT: "ws://browserless:3000?token=${BROWSERLESS_TOKEN}"
      # BROWSER_USER_AGENT: "" # unset

      # Optional search overrides. Leaving these unset intentionally keeps the
      # default search broad; uncomment only the constraints you want.
      # DAFT_LOCATION: "dublin-city,drogheda-and-surrounds-louth"
      # DAFT_SECTION_PATH: "new-homes-for-sale" # e.g. another Daft section
      # DAFT_RADIUS_KM: "20"
      # DAFT_PRICE_MIN_EUR: "" # unset; no minimum
      # DAFT_PRICE_MAX_EUR: "499999"
      # DAFT_BEDS_MIN: "3"
      # DAFT_BEDS_MAX: "" # unset
      # DAFT_PROPERTY_TYPES: "houses"
      # DAFT_BATHS_MIN: "" # unset
      # DAFT_BATHS_MAX: "" # unset
      # DAFT_MEDIA_TYPES: "" # unset; equivalent to any
      # DAFT_KEYWORD: "" # unset
      # DAFT_AVAILABILITY: "published"
      # DAFT_ADDED_IN_LAST_DAYS: "1"
      # DAFT_OPEN_VIEWINGS_FROM: "" # unset
      # DAFT_SORT: "publishDateDesc"
      # DAFT_MAX_PAGES: "1" # unset = follow all Daft result pages
      # DAFT_REQUEST_DELAY_MS: "1000" # minimum gap between Daft navigations
      # SHPS_FILTER: "off" # use "only" to keep SHPS-only or "exclude" to remove them

      # Image defaults already supplied by Dockerfile.
      # NODE_ENV: "production"
      # PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    volumes:
      - bellwatch-data:/data
    networks:
      - bellwatch

  # Persistent listing state for the monitor.
  postgres:
    image: postgres:17-alpine
    # POSTGRES_DB and POSTGRES_USER default to daft in this stack so they
    # match the monitor's active DATABASE_URL default.
    # POSTGRES_PASSWORD is required.
    environment:
      POSTGRES_DB: "daft"
      POSTGRES_USER: "daft"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bellwatch

  # Dedicated Chromium/CDP service. The monitor connects over the internal
  # network; the host port is localhost-only for optional debugging.
  # The image and resource settings below are deliberate stack policy.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      # Required Browserless authentication token.
      # CONCURRENT, QUEUED, and TIMEOUT are deliberate resource defaults.
      TOKEN: "${BROWSERLESS_TOKEN:?Set BROWSERLESS_TOKEN in .env}"
      CONCURRENT: "2"
      QUEUED: "4"
      TIMEOUT: "120000"
    # The host debugging port is fixed to localhost:3000; the monitor uses
    # the internal service name.
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "2g"
    restart: unless-stopped
    networks:
      - bellwatch

volumes:
  bellwatch-data:
  postgres-data:

networks:
  # The internal network name is fixed to bellwatch.
  bellwatch:
    name: bellwatch
