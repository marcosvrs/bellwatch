name: bellwatch
services:
  bellwatch:
    image: ghcr.io/marcosvrs/bellwatch
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browserless:
        condition: service_started
    environment:
      # The monitor sends notifications through the configured Shoutrrr URL.
      SHOUTRRR_URL: "${SHOUTRRR_URL:?Set SHOUTRRR_URL in .env}"
      # Auto mode detects the endpoint and uses the external Browserless service.
      PLAYWRIGHT_WS_ENDPOINT: "${PLAYWRIGHT_WS_ENDPOINT:-ws://browserless:3000?token=${BROWSERLESS_TOKEN}}"
      # Match Browserless's 120-second session timeout.
      BROWSER_TIMEOUT_MS: "${BROWSER_TIMEOUT_MS:-120000}"
      # Compose's search profile intentionally differs from parser defaults.
      DAFT_ADDED_IN_LAST_DAYS: "${DAFT_ADDED_IN_LAST_DAYS:-1}"
      DAFT_SORT: "${DAFT_SORT:-publishDateDesc}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-daft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-daft}}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    volumes:
      - bellwatch-data:/data
    networks:
      - bellwatch

  # Shared listing state for one or more monitor instances.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-daft}"
      POSTGRES_USER: "${POSTGRES_USER:-daft}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bellwatch

  # Distributed poll lease. Postgres remains the source of shared listing state.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - bellwatch

  # Dedicated Chromium/CDP service. The monitor connects over the internal
  # network; the host port is localhost-only for optional debugging.
  browserless:
    image: ${BROWSERLESS_IMAGE:-ghcr.io/browserless/chromium:latest}
    environment:
      TOKEN: "${BROWSERLESS_TOKEN:?Set BROWSERLESS_TOKEN in .env}"
      CONCURRENT: "${BROWSERLESS_CONCURRENT:-2}"
      QUEUED: "${BROWSERLESS_QUEUED:-4}"
      TIMEOUT: "${BROWSERLESS_TIMEOUT_MS:-120000}"
    ports:
      - "127.0.0.1:${BROWSERLESS_PORT:-3000}:3000"
    shm_size: "2g"
    restart: unless-stopped
    networks:
      - bellwatch

volumes:
  bellwatch-data:

networks:
  bellwatch:
    name: ${COMPOSE_NETWORK:-bellwatch}
