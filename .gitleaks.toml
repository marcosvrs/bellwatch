title = "Bellwatch secret and PII policy"
minVersion = "v8.30.0"

[extend]
useDefault = true

[allowlist]
description = "Generated files and safe documentation placeholders"
paths = [
  '''(?:^|/)(?:node_modules|dist|coverage|\.cache|\.stryker-tmp|\.venv)(?:/|$)''',
]
regexes = [
  '''(?i)\b[\w.+-]+@(?:[\w.-]+\.)?example(?:\.(?:com|net|org))?\b''',
]

[[rules]]
id = "pii-email-address"
description = "Potential personal email address"
regex = '''(?i)\b[A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}\b'''
keywords = ["@"]
tags = ["pii", "email"]

[[rules.allowlists]]
description = "Documentation placeholder domains"
regexes = [
  '''(?i)\b[\w.+-]+@(?:[\w.-]+\.)?example(?:\.(?:com|net|org))?\b''',
]

[[rules]]
id = "pii-irish-phone-number"
description = "Potential Irish or international Irish phone number"
regex = '''(?i)(?:\+353[ .-]?8[0-9][ .-]?[0-9]{3}[ .-]?[0-9]{4}|\b08[0-9][ .-]?[0-9]{3}[ .-]?[0-9]{4})\b'''
tags = ["pii", "phone"]

[[rules]]
id = "pii-iban"
description = "Potential IBAN bank account identifier"
regex = '''(?i)\b(?:IE|GB|DE|FR|NL|ES|IT|BE|PT|AT|CH|DK|NO|SE|FI|PL|LU)[0-9]{2}(?:[A-Z0-9][ ]?){11,30}\b'''
keywords = ["IE", "GB", "DE", "FR", "NL", "ES", "IT", "BE", "PT", "AT", "CH", "DK", "NO", "SE", "FI", "PL", "LU"]
tags = ["pii", "financial"]

[[rules]]
id = "pii-irish-pps-number"
description = "Potential Irish Personal Public Service number"
regex = '''(?i)\b(?:PPSN?|personal public service(?:s)? number)\s*[:=]?\s*\d{7}[A-Z]{1,2}\b'''
tags = ["pii", "irish"]

[[rules]]
id = "pii-us-social-security-number"
description = "Potential US Social Security number"
regex = '''(?i)\b(?:SSN|social security(?: number)?)\s*[:=]?\s*\d{3}-\d{2}-\d{4}\b'''
tags = ["pii", "us"]
