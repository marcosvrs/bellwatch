name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable safe Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Apply automatic merge policy
        id: policy
        shell: bash
        run: |
          if [[ "$PR_TITLE" == Bump\ node\ from\ * ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automatic merge for Node base-image updates: $PR_TITLE"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Enable squash auto-merge
        if: steps.policy.outputs.eligible == 'true'
        run: >-
          gh pr merge "$PR_NUMBER"
          --repo "$REPOSITORY"
          --auto
          --squash
          --delete-branch
