name: Push validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validation and mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run validation gate
        run: npm run check

      # Mutation testing is intentionally limited to protected-branch pushes.
      # It is substantially slower than the PR gate and runs once per commit.
      - name: Run mutation gate
        run: npm run mutation
