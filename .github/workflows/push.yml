name: Push validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validation and changed-file mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan secrets and PII
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore TypeScript compiler cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-summary: errors

      - name: Install dependencies
        run: sfw npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run changed-file validation
        run: npm run check:changed -- "${{ github.event.before }}" "${{ github.sha }}"
