name: Push validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validation and changed-file mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan secrets and PII
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2

      - name: Restore TypeScript compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-summary: errors

      - name: Install dependencies
        run: sfw npm ci --ignore-scripts --no-audit --no-fund
      - name: Use npm bulk audit endpoint
        run: sfw npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Audit npm dependencies
        run: sfw npm audit --audit-level=high
      - name: Verify npm registry signatures
        run: sfw npm audit signatures

      - name: Run changed-file validation
        run: npm run check:changed -- "${{ github.event.before }}" "${{ github.sha }}"
