name: Publish Docker image

on:
  workflow_run:
    workflows:
      - Push validation
      - Pull request validation
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: publish-docker-image-${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.id || 'production' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  e2e:
    name: Production image e2e
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_IMAGE: bellwatch:e2e-${{ github.run_id }}
    steps:
      - name: Download validated PR images
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bellwatch-pr-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp/bellwatch-pr-image
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read validated PR base SHA
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        id: pr-metadata
        run: |
          set -euo pipefail
          base_sha="$(tr -d '\n' < /tmp/bellwatch-pr-image/bellwatch-pr-base-sha)"
          if ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid validated PR base SHA: $base_sha" >&2
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Check out trusted E2E scripts for a PR image
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr-metadata.outputs.base_sha }}
          persist-credentials: false
      - name: Check out validated source
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Load validated PR amd64 image
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          docker load --input /tmp/bellwatch-pr-image/bellwatch-pr-amd64.tar
          docker tag "bellwatch:pr-${PR_HEAD_SHA}-amd64" "$E2E_IMAGE"
          docker image inspect "$E2E_IMAGE" >/dev/null

      - name: Build production image for e2e
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          cache-from: |
            type=gha,scope=bellwatch-publish
            type=gha,scope=bellwatch-publish-e2e
          cache-to: type=gha,mode=max,scope=bellwatch-publish-e2e
          platforms: linux/amd64
          load: true
          tags: ${{ env.E2E_IMAGE }}
          provenance: false

      - name: Run production image fixture e2e
        run: node scripts/e2e.mjs
        env:
          CONTAINER_CLI: docker
          E2E_IMAGE: ${{ env.E2E_IMAGE }}
      - name: Run production image live Daft e2e
        run: node scripts/e2e-live.mjs
        env:
          CONTAINER_CLI: docker
          E2E_IMAGE: ${{ env.E2E_IMAGE }}
          E2E_TIMEOUT_MS: "240000"

  publish:
    needs: e2e
    name: Build and publish Docker image
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
      attestations: write
      id-token: write
    if: >-
      needs.e2e.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out validated source
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pull request number
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        id: pr-number
        env:
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            pr_number="$EVENT_PR_NUMBER"
          else
            head_owner="${HEAD_REPOSITORY%%/*}"
            pr_number="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=all \
                -f head="${head_owner}:${HEAD_BRANCH}" \
                -f base=master \
                --jq '.[0].number // empty'
            )"
          fi
          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Could not resolve the pull request for ${HEAD_REPOSITORY}:${HEAD_BRANCH}" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Verify PR validation is current
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        id: pr-current
        env:
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha // empty'
          )"
          if [[ "$current_sha" == "$PR_HEAD_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Validation ${PR_HEAD_SHA} is stale; current PR head is ${current_sha}"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated PR images
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && steps.pr-current.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bellwatch-pr-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp/bellwatch-pr-image
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Load validated PR images
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && steps.pr-current.outputs.current == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          docker load --input /tmp/bellwatch-pr-image/bellwatch-pr-amd64.tar
          docker load --input /tmp/bellwatch-pr-image/bellwatch-pr-arm64.tar
          docker image inspect "bellwatch:pr-${PR_HEAD_SHA}-amd64" >/dev/null
          docker image inspect "bellwatch:pr-${PR_HEAD_SHA}-arm64" >/dev/null

      - name: Generate image metadata
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }},enable=${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' }}
      - name: Build and push image
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          cache-from: |
            type=gha,scope=bellwatch-publish
            type=gha,scope=bellwatch-publish-e2e
          cache-to: type=gha,mode=max,scope=bellwatch-publish
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true

      - name: Push PR alpha image
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && steps.pr-current.outputs.current == 'true'
        id: push-alpha
        env:
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          source_image_prefix="bellwatch:pr-${PR_HEAD_SHA}"
          target_image="${TARGET_IMAGE}:alpha-${PR_NUMBER}"
          for architecture in amd64 arm64; do
            docker tag \
              "${source_image_prefix}-${architecture}" \
              "${target_image}-${architecture}"
            docker push "${target_image}-${architecture}"
          done
          docker manifest rm "$target_image" >/dev/null 2>&1 || true
          docker manifest create \
            "$target_image" \
            "${target_image}-amd64" \
            "${target_image}-arm64"
          docker manifest push "$target_image" >/dev/null
          digest="$(docker buildx imagetools inspect "$target_image" --format '{{.Manifest.Digest}}')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the published alpha digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
