name: Pull request validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation and changed-file mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Review dependency changes
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
      - name: Scan secrets and PII
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-summary: errors

      - name: Restore TypeScript compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: typescript-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      - name: Install dependencies
        run: sfw npm ci --ignore-scripts --no-audit --no-fund
      - name: Use npm bulk audit endpoint
        run: sfw npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Audit npm dependencies
        run: sfw npm audit --audit-level=high
      - name: Verify npm registry signatures
        run: sfw npm audit signatures

      - name: Run changed-file validation
        run: npm run check:changed -- "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Run full quality gate
        run: npm run check
      - name: Set up Docker Buildx for live Daft E2E
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image for live Daft E2E
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          cache-from: type=gha,scope=bellwatch-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=bellwatch-pr-${{ github.event.pull_request.number }}
          load: true
          tags: bellwatch:live-e2e-${{ github.run_id }}
          provenance: false
      - name: Run live Daft E2E
        run: npm run e2e:live
        env:
          CONTAINER_CLI: docker
          E2E_IMAGE: bellwatch:live-e2e-${{ github.run_id }}
          E2E_TIMEOUT_MS: "240000"
