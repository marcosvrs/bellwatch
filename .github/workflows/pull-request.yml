name: Pull request validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation and changed-file mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Scan secrets and PII
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-summary: errors

      - name: Restore TypeScript compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: typescript-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
      - name: Install dependencies
        run: sfw npm ci --ignore-scripts --no-audit --no-fund
      - name: Use npm bulk audit endpoint
        run: sfw npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Audit npm dependencies
        run: sfw npm audit --audit-level=high
      - name: Verify npm registry signatures
        run: sfw npm audit signatures

      - name: Run changed-file validation
        run: npm run check:changed -- "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Run full quality gate
        run: npm run check
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx for live Daft E2E
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 production image for live Daft E2E
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          cache-from: type=gha,scope=bellwatch-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=bellwatch-pr-${{ github.event.pull_request.number }}
          outputs: type=docker,dest=/tmp/bellwatch-pr-amd64.tar
          platforms: linux/amd64
          tags: bellwatch:pr-${{ github.event.pull_request.head.sha }}-amd64
          provenance: false
      - name: Load amd64 production image
        run: docker load --input /tmp/bellwatch-pr-amd64.tar
      - name: Run live Daft E2E
        run: npm run e2e:live
        env:
          CONTAINER_CLI: docker
          E2E_IMAGE: bellwatch:pr-${{ github.event.pull_request.head.sha }}-amd64
          E2E_TIMEOUT_MS: "240000"
      - name: Build arm64 image for privileged publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          cache-from: type=gha,scope=bellwatch-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=bellwatch-pr-${{ github.event.pull_request.number }}
          outputs: type=docker,dest=/tmp/bellwatch-pr-arm64.tar
          platforms: linux/arm64
          tags: bellwatch:pr-${{ github.event.pull_request.head.sha }}-arm64
          provenance: false
      - name: Load arm64 production image
        run: docker load --input /tmp/bellwatch-pr-arm64.tar
      - name: Smoke-test arm64 image and healthcheck
        env:
          PR_IMAGE: bellwatch:pr-${{ github.event.pull_request.head.sha }}-arm64
        run: |
          set -euo pipefail
          runtime_data="$(mktemp -d)"
          chmod 777 "$runtime_data"
          trap 'rm -rf "$runtime_data"' EXIT
          touch "$runtime_data/heartbeat"
          docker run --rm \
            --platform linux/arm64 \
            --volume "$runtime_data:/data" \
            "$PR_IMAGE" \
            node dist/healthcheck.js
      - name: Upload PR images for privileged publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bellwatch-pr-image-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/bellwatch-pr-amd64.tar
            /tmp/bellwatch-pr-arm64.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 7
