name: Pull request validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, changed-file coverage, and mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Review dependency changes
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
      - name: Scan secrets and PII
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-summary: errors

      - name: Restore TypeScript compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: sfw npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit npm dependencies
        run: sfw npm audit --audit-level=high
      - name: Verify npm registry signatures
        run: sfw npm audit signatures

      - name: Run changed-file validation
        run: npm run check:changed -- "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
