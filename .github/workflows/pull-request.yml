name: Pull request validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, changed-file coverage, and mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore TypeScript compiler cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            validation-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run changed-file validation
        run: npm run check:changed -- "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
